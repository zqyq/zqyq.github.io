# 全站唯一的论文数据源。首页 / About / Publications / Group / CV / Research 全部由此渲染，
# 模板里不再出现任何论文 id —— 想改哪一页显示什么，只改这个文件的标记。
#
# 加一篇论文（约一分钟）：
#   1. 在 papers: 下按年份从新到旧插入一个块，照抄下面任一块的字段。
#   2. 必填：id / title / year / venue / kind / status / authors / topic。thumb（论文原图）应填，
#      暂时没有图可以整行不写，校验脚本会 warn 但不拦。
#      - id：小写连字符，全站唯一，同时是图片文件名 assets/img/papers/<id>.jpg。
#      - kind：conference | journal | preprint（决定首页"同行评审"计数与 CV 的拆分）。
#      - status：published | accepted | to_appear | preprint（自动长 badge，别在标题里自己写"Accepted"）。
#      - topic：crowd | 3d | driving | beyond（决定它出现在 Research 页哪一条研究线）。
#      - authors：数组，把你的名字写成 "Qi Zhang"，页面会自动加粗；通讯作者另用 corr: ["Qi Zhang"] 标 *。
#      - links：只放 arxiv / pdf / doi / landing / code / dataset / project / video 里真实存在的键。
#   3. 选显示位置（不显示就不写这一行）：
#        selected: true     首页 Selected Publications
#        foundational: true 首页"Where this programme started"那一格
#        group_pick: true   Group 页 Research by group members
#        anchor: true       Research 页该研究线展示的锚点论文
#   4. 跑工作区里的校验脚本：python ../tools/check_pubs.py（它不在本仓库内，是本地开发工具）。
#
# 规矩：未核实的字段一律留空，不凭印象填。citations 是 Google Scholar 计数，快照日期见 _data/scholar.yml。
# ccf 字段暂空 —— CCF 等级需核实后才写入页面。

