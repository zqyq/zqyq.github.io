---
layout: default
---
<article class="section" style="margin-top:2.6rem">
  <h1 class="hero-name" style="font-size:1.8rem">{{ page.title }}</h1>
  <div class="post-meta tabnum">{{ page.date | date: "%d %B %Y" }}</div>
  <div class="post-body" style="margin-top:1.6rem">
    {{ content }}
  </div>
  <p style="margin-top:2.5rem">
    <a class="back-link" href="/blog/">&larr; All news</a>
  </p>
</article>
